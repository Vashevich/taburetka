# Автотест «Табуретки» при каждой публикации (Толя, 15.11.2026). Выкладку GitHub Pages не блокирует.
name: Автотест Табуретки
on:
  push:
  workflow_dispatch:
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.47.0
      - run: python -m playwright install --with-deps chromium
      - run: (python -m http.server 8767 &) && sleep 2
      - run: python -u tests/smoke.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/shots/
